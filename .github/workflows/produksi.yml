name: Produksi video INFODOKTER

on:
  push:
    branches: [main]
    paths: ["produksi/**"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Opsional: folder di produksi/ (kosong = semua yang belum diproduksi)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: produksi
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang ffmpeg & library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow numpy piper-tts
      - name: Produksi (VO Gemini, cadangan Piper)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/produksi.py ${{ github.event.inputs.folder }}
      - name: Simpan hasil ke antrean
        run: |
          git config user.name "infodokter-bot"
          git config user.email "infodokter-bot@users.noreply.github.com"
          git add antrean/
          git diff --cached --quiet || (git commit -m "Produksi video $(TZ=Asia/Jakarta date +'%F %H:%M')" && git pull --rebase -q && git push)
